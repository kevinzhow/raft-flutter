name: raft_updater
description: In-app auto-update for macOS (Sparkle 2), Windows (WinSparkle) and Linux AppImage (zsync delta) with a release-page fallback everywhere else.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: RaftUpdaterPlugin
      windows:
        pluginClass: RaftUpdaterPlugin
