name: raft_ui
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.13.5
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  raft_theme:
    path: ../raft_theme
  flutter_markdown_plus:
    path: ../../third_party/flutter_markdown_plus
  markdown: ^7.3.0
  mermaid_flutter: ^0.3.0
  mermaid_core: ^0.3.0
  re_highlight: ^0.0.3
  flutter_widget_from_html_core: ^0.17.4
  html: ^0.15.6
  path_parsing: ^1.1.0
  intl: ^0.20.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: ^3.0.10
flutter:
  fonts:
    # Raft Design System faces (raft-ui 0.7.1 fonts.css): Space Grotesk is what people say, Space Mono is what machines write.
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk.ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: RaftDiagramSans
      fonts:
        - asset: assets/fonts/LiberationSans-Regular.ttf
        - asset: assets/fonts/LiberationSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/LiberationSans-Italic.ttf
          style: italic
        - asset: assets/fonts/LiberationSans-BoldItalic.ttf
          weight: 700
          style: italic
