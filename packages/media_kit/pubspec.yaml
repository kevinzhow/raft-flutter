name: media_kit
description: A cross-platform video player & audio player for Flutter & Dart. Performant, stable, feature-proof & modular.
homepage: https://github.com/media-kit/media-kit
repository: https://github.com/media-kit/media-kit
version: 1.2.6
publish_to: none
resolution: workspace

topics:
  - video
  - video-player
  - audio
  - audio-player
  - cross-platform

environment:
  sdk: ^3.13.5

dependencies:
  collection: ^1.17.0
  http: ">=0.13.0 <2.0.0"
  image: ^4.0.17
  meta: ^1.8.0
  path: ^1.8.0
  safe_local_storage: ^2.0.1
  synchronized: ^3.1.0
  universal_platform: ^1.0.0+1
  web: ^1.1.0
  uri_parser: ^3.0.1
  uuid: ">=2.0.0 <5.0.0"

dev_dependencies:
  lints: ^6.1.0

flutter:
  assets:
    - assets/web/
