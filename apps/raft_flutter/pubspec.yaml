name: raft_flutter
publish_to: none
description: Raft collaboration client for Linux, Android, macOS and Windows.
version: 0.1.0+1
environment:
  sdk: ^3.13.5
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  raft_ui: ^0.1.0
  raft_client: ^0.1.0
  raft_sync: ^0.1.0
  flutter_riverpod: ^3.4.3
  flutter_chat_ui:
    path: ../../packages/flutter_chat_ui
  flutter_chat_core: ^2.9.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.4
  file_selector: ^1.1.0
  app_badge_plus: ^1.3.5
  image_picker: ^1.2.4
  image_picker_android: ^0.8.13+25
  image_picker_platform_interface: ^2.11.2
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.27.0
  webview_flutter_platform_interface: ^2.15.1
  dio: ^5.11.1
  go_router: ^17.0.0
  app_links: ^7.2.2
  receive_intent: ^0.2.8
  uri_content: ^4.0.1
  flutter_dynamic_icon_plus:
    path: ../../packages/flutter_dynamic_icon_plus
  raft_updater:
    path: ../../packages/raft_updater
  flutter_local_notifications: ^22.3.1
  flutter_local_notifications_linux: ^8.0.1
  dbus: ^0.7.11
  workmanager: ^0.10.10
  crypto: ^3.0.7
  drift: ^2.35.1
  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.3
  timezone: ^0.11.1
  html: ^0.15.6
  media_kit:
    path: ../../packages/media_kit
  media_kit_video: ^2.0.1
  # Windows and Linux play through media_kit/libmpv with bundled FFmpeg (system
  # codecs there are optional or missing: Windows Media Foundation needs the
  # HEVC extension, stock Fedora GStreamer has no H.264/HEVC). Android, iOS and
  # macOS use the platform player through video_player (ExoPlayer, AVPlayer),
  # so only the Windows and Linux libmpv builds are depended on - never the
  # media_kit_libs_video umbrella, which would bundle libmpv on every platform.
  # Linux additionally bundles its own libmpv (tool/prepare-media-linux).
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_video: ^1.0.11
  video_player: ^2.11.1
  flutter_svg: ^2.3.0
  desktop_drop:
    path: ../../packages/desktop_drop
  pasteboard: ^0.5.0
  ffi: ^2.2.0
  flutter_timezone: ^5.1.1
dev_dependencies:
  sqlite3: ^3.5.2
  fake_async: ^1.3.3
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  vm_service: any
  flutter_lints: ^6.0.0
  leak_tracker_flutter_testing: ^3.0.10
  file_selector_platform_interface: ^2.7.0
  video_player_platform_interface: ^6.9.0
  socket_io_client: any
  analyzer: ^12.1.0
flutter:
  uses-material-design: true
