name: raft_flutter_workspace
publish_to: none
environment:
  sdk: ^3.13.5
workspace:
  - apps/raft_flutter
  - packages/raft_ui
  - packages/raft_theme
  - packages/raft_client
  - packages/raft_sync
  - packages/desktop_drop
  - packages/app_badge_plus
  - packages/media_kit
  - packages/flutter_chat_ui
  - packages/flutter_dynamic_icon_plus
  - packages/raft_updater
  - tool/ds_audit
dependency_overrides:
  # One pointer-order fix; tool/flutter verifies the fixed Pub archive and
  # prepares this private copy before resolving/building. Shared cache untouched.
  flutter_inappwebview_linux:
    path: .dart_tool/raft_plugins/flutter_inappwebview_linux
