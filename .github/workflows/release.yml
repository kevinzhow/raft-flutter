name: Build and release

on:
  push:
    # vX.Y.Z and vX.Y.Z+N: +N distinguishes releases; run_number is the build number.
    # Builds run only for release tags and manual dispatch, not for pull requests.
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platforms; empty uses enabled platforms in tool/release-platforms.json'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      build_number: ${{ steps.plan.outputs.build_number }}
      independent_matrix: ${{ steps.platform-plan.outputs.independent_matrix }}
      linux_matrix: ${{ steps.platform-plan.outputs.linux_matrix }}
      has_independent: ${{ steps.platform-plan.outputs.has_independent }}
      has_linux: ${{ steps.platform-plan.outputs.has_linux }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m unittest discover -s tool/tests -p 'test_release*.py' -v
          python -m unittest discover -s tool/tests -p 'test_appcast.py' -v
          python -m unittest discover -s tool/tests -p 'test_windows_installer.py' -v
      - id: plan
        env:
          RELEASE_PLATFORMS: ${{ inputs.platforms }}
        run: python tool/release.py plan
      - id: platform-plan
        name: Separate Linux runtime consumers from independent platforms
        env:
          RELEASE_MATRIX: ${{ steps.plan.outputs.matrix }}
        run: |
          python - <<'PY'
          import json, os
          rows = json.loads(os.environ['RELEASE_MATRIX'])['include']
          independent = [r for r in rows if r['platform'] not in {'linux', 'appimage'}]
          # Linux packages target Noble and use its distribution development libraries.
          # This does not enable the currently disabled Linux tar platform.
          linux = [{**r, 'runner': 'ubuntu-24.04'} for r in rows if r['platform'] in {'linux', 'appimage'}]
          values = {
              'independent_matrix': json.dumps({'include': independent}, separators=(',', ':')),
              'linux_matrix': json.dumps({'include': linux}, separators=(',', ':')),
              'has_independent': str(bool(independent)).lower(),
              'has_linux': str(bool(linux)).lower(),
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for key, value in values.items():
                  output.write(f'{key}={value}\n')
          PY


  prepare-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the shared release for independent platform uploads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MATRIX: ${{ needs.plan.outputs.matrix }}
        run: python tool/release.py prepare

  platform:
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          needs.plan.outputs.has_independent == 'true' &&
          (github.event_name != 'push' || needs.prepare-release.result == 'success') }}
    needs: [plan, prepare-release]
    name: ${{ matrix.platform }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.independent_matrix) }}
    # The called build job explicitly reduces this to read. Only its tag-only
    # publisher receives write permission; PR/manual jobs never publish.
    permissions:
      contents: write
    uses: ./.github/workflows/release-platform.yml
    with:
      platform: ${{ matrix.platform }}
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      version: ${{ needs.plan.outputs.version }}
      build_number: ${{ needs.plan.outputs.build_number }}
      publish: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    secrets:
      RAFT_ANDROID_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.RAFT_ANDROID_KEYSTORE_BASE64 || '' }}
      RAFT_ANDROID_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.RAFT_ANDROID_STORE_PASSWORD || '' }}
      RAFT_ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.RAFT_ANDROID_KEY_PASSWORD || '' }}
      RAFT_ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.RAFT_ANDROID_KEY_ALIAS || '' }}
      SPARKLE_ED_PRIVATE_KEY: ${{ github.event_name == 'push' && secrets.SPARKLE_ED_PRIVATE_KEY || '' }}

  linux-platform:
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          needs.plan.outputs.has_linux == 'true' &&
          (github.event_name != 'push' || needs.prepare-release.result == 'success') }}
    needs: [plan, prepare-release]
    name: ${{ matrix.platform }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.linux_matrix) }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-platform.yml
    with:
      platform: ${{ matrix.platform }}
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      version: ${{ needs.plan.outputs.version }}
      build_number: ${{ needs.plan.outputs.build_number }}
      publish: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    secrets:
      SPARKLE_ED_PRIVATE_KEY: ${{ github.event_name == 'push' && secrets.SPARKLE_ED_PRIVATE_KEY || '' }}
