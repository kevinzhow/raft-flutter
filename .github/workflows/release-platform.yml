name: Build and publish one platform

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      arch:
        type: string
        required: true
      runner:
        type: string
        required: true
      version:
        type: string
        required: true
      build_number:
        type: string
        required: true
      publish:
        type: boolean
        required: true
    secrets:
      RAFT_ANDROID_KEYSTORE_BASE64:
        required: false
      RAFT_ANDROID_STORE_PASSWORD:
        required: false
      RAFT_ANDROID_KEY_PASSWORD:
        required: false
      RAFT_ANDROID_KEY_ALIAS:
        required: false
      SPARKLE_ED_PRIVATE_KEY:
        required: false

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
      # Public by design (verifies update signatures). Empty disables auto-update.
      SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
      # Public feedback export worker origin. Empty hides the Report Issue entry.
      RAFT_FEEDBACK_EXPORT_URL: ${{ vars.RAFT_FEEDBACK_EXPORT_URL }}
    steps:
      - name: Verify the hosted native release architecture
        if: inputs.platform == 'macos' || inputs.platform == 'appimage'
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ inputs.platform }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          if [ "$RELEASE_PLATFORM" = macos ]; then
            test "$RUNNER_OS" = macOS
            test "$RUNNER_ARCH" = ARM64
            test "$(uname -m)" = arm64
          else
            test "$RUNNER_OS" = Linux
            test "$RUNNER_ARCH" = X64
            test "$(uname -m)" = x86_64
            . /etc/os-release
            test "$ID" = ubuntu
            test "$VERSION_ID" = 24.04
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          architecture: ${{ runner.arch }}
          channel: stable
          cache: true
      - name: Select the pinned SDK wrapper
        run: python tool/release.py sdk
      - name: Initialize the downloaded Flutter SDK
        run: flutter --version --machine
      - name: Set up Java for Android
        if: inputs.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        if: inputs.platform == 'android'
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK components
        if: inputs.platform == 'android'
        shell: bash
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Select Ruby for the pinned CocoaPods
        if: inputs.platform == 'macos'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install the locked macOS CocoaPods version
        if: inputs.platform == 'macos'
        run: |
          gem install cocoapods --version 1.16.2 --no-document
          gem install json --version 2.18.0 --no-document
      - name: Check macOS packaging tools
        if: inputs.platform == 'macos'
        run: |
          xcodebuild -version
          pod --version
          test "$(pod --version)" = "1.16.2"
          ruby -rjson -e 'abort "Unexpected JSON serializer" unless JSON::VERSION == "2.18.0"'
          command -v codesign
      - name: Test macOS packaging tools
        if: inputs.platform == 'macos'
        run: python -m unittest discover -s tool/tests -p test_macos_release.py -v
      - name: Test update packaging tools
        if: inputs.platform == 'windows'
        run: |
          python -m unittest discover -s tool/tests -p test_appcast.py -v
          python -m unittest discover -s tool/tests -p test_windows_installer.py -v
      - name: Ensure Inno Setup for the WinSparkle installer
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --version=6.4.3 -y --no-progress }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 is unavailable' }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test Linux packaging tools
        if: inputs.platform == 'linux' || inputs.platform == 'appimage'
        run: |
          python -m unittest discover -s tool/tests -p test_media_linux_sources.py -v
          if [ '${{ inputs.platform }}' = appimage ]; then
            python -m unittest discover -s tool/tests -p test_appimage.py -v
          fi
      - name: Install Linux build and media dependencies
        if: inputs.platform == 'linux' || inputs.platform == 'appimage'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev libmpv2 libmpv-dev patchelf poppler-utils zsync
          if [ '${{ inputs.platform }}' = appimage ]; then
            python tool/prepare-media-appimage
          else
            python tool/prepare-media-linux
          fi
      - name: Install AppImage startup test tools
        if: inputs.platform == 'appimage'
        run: sudo apt-get install -y libgdk-pixbuf2.0-bin librsvg2-common xvfb x11-utils imagemagick desktop-file-utils gnome-keyring at-spi2-core
      - name: Resolve locked dependencies
        run: python tool/flutter pub get --enforce-lockfile
      - name: Build and package desktop
        if: inputs.platform != 'android'
        run: python tool/release.py build ${{ inputs.platform }}
      - name: Build and verify signed ARM64 Android APK
        if: inputs.platform == 'android' && github.event_name != 'pull_request'
        env:
          RAFT_ANDROID_KEYSTORE_BASE64: ${{ secrets.RAFT_ANDROID_KEYSTORE_BASE64 }}
          RAFT_ANDROID_STORE_PASSWORD: ${{ secrets.RAFT_ANDROID_STORE_PASSWORD }}
          RAFT_ANDROID_KEY_PASSWORD: ${{ secrets.RAFT_ANDROID_KEY_PASSWORD }}
          RAFT_ANDROID_KEY_ALIAS: ${{ secrets.RAFT_ANDROID_KEY_ALIAS }}
        run: python tool/release.py build android
      - name: Run the production AppImage at 2x display scale
        if: inputs.platform == 'appimage'
        run: |
          artifact=$(find build/release -maxdepth 1 -name '*.AppImage' -print -quit)
          xvfb-run -a -s '-screen 0 2880x1800x24' dbus-run-session -- python tool/appimage-smoke.py --artifact "$artifact" --output build/appimage-smoke --mode direct
          xvfb-run -a -s '-screen 0 2880x1800x24' dbus-run-session -- python tool/appimage-smoke.py --artifact "$artifact" --output build/appimage-smoke --mode extract
      - name: Preserve Linux HiDPI screenshots and startup evidence
        if: inputs.platform == 'appimage' && always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-smoke
          path: build/appimage-smoke/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve macOS dependency diagnostics
        if: inputs.platform == 'macos' && always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-podspec-diagnostics
          path: |
            apps/raft_flutter/macos/Pods/Local Podspecs/*.json
            apps/raft_flutter/macos/Podfile.lock
          if-no-files-found: warn
          retention-days: 14
      - name: Ensure tracked dependencies stayed locked
        run: git diff --exit-code
      - id: artifact
        uses: actions/upload-artifact@v4
        if: success() || (failure() && inputs.platform == 'appimage')
        with:
          name: release-${{ inputs.platform }}-${{ inputs.arch }}
          overwrite: true
          path: build/release/*
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 2 || 14 }}  # tag builds are copied into the Release in the same run


  appimage-compatibility:
    needs: build
    if: inputs.platform == 'appimage'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: build/release
      - name: Test downloaded AppImage on Fedora KDE Wayland without FUSE
        run: |
          chmod +x build/release/*.AppImage
          mkdir -p build/appimage-compatibility
          docker run --rm --cap-add IPC_LOCK --cap-add SYS_NICE --env GITHUB_ACTIONS=true --volume "$PWD:/source:ro" --volume "$PWD/build/release:/artifacts:ro" --volume "$PWD/build/appimage-compatibility:/evidence" fedora:44 bash /source/tool/appimage-fedora-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-appimage-fedora-evidence
          path: build/appimage-compatibility/
          if-no-files-found: warn
          retention-days: 14


  publish:
    # These needs belong to THIS platform instance, never the whole matrix.
    # !cancelled() also permits non-AppImage jobs whose compatibility job skipped.
    if: >-
      ${{ !cancelled() && inputs.publish && github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' &&
          (inputs.platform != 'appimage' || needs.appimage-compatibility.result == 'success') }}
    needs: [build, appimage-compatibility]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: build/release
          merge-multiple: true
      - name: Verify and publish this platform independently
        env:
          GH_TOKEN: ${{ github.token }}
          # Signs the macOS/Windows appcast enclosure; GitHub masks it in logs and
          # tool/release.py never prints it. Only this tag-only publisher sees it.
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: python tool/release.py publish ${{ inputs.platform }}
